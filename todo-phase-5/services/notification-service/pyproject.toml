[project]
name = "donekaro-notification-service"
version = "1.0.0"
description = "DoneKaro Notification Service - Push notification delivery"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
