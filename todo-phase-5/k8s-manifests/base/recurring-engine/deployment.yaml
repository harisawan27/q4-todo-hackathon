apiVersion: apps/v1
kind: Deployment
metadata:
  name: recurring-engine
  namespace: donekaro
  labels:
    app: recurring-engine
    app.kubernetes.io/part-of: donekaro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recurring-engine
  template:
    metadata:
      labels:
        app: recurring-engine
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "recurring-engine"
        dapr.io/app-port: "8002"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: recurring-engine
          image: donekaro/recurring-engine:latest
          ports:
            - containerPort: 8002
          env:
            - name: SERVICE_NAME
              value: "recurring-engine"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DAPR_HTTP_PORT
              value: "3502"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recurring-engine
  namespace: donekaro
  labels:
    app: recurring-engine
spec:
  selector:
    app: recurring-engine
  ports:
    - port: 80
      targetPort: 8002
      protocol: TCP
  type: ClusterIP
