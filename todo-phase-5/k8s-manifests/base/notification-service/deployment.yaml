apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: donekaro
  labels:
    app: notification-service
    app.kubernetes.io/part-of: donekaro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "notification-service"
        dapr.io/app-port: "8001"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: notification-service
          image: donekaro/notification-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: SERVICE_NAME
              value: "notification-service"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DAPR_HTTP_PORT
              value: "3501"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: donekaro
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - port: 80
      targetPort: 8001
      protocol: TCP
  type: ClusterIP
