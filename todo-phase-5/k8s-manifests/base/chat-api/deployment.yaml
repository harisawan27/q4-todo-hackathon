apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: donekaro
  labels:
    app: chat-api
    app.kubernetes.io/part-of: donekaro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "chat-api"
        dapr.io/app-port: "8000"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: chat-api
          image: donekaro/chat-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "chat-api"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DAPR_HTTP_PORT
              value: "3500"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: donekaro
  labels:
    app: chat-api
spec:
  selector:
    app: chat-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
