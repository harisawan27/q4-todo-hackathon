apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: chat-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 10

images:
  - name: donekaro/chat-api
    newName: your-acr.azurecr.io/donekaro/chat-api
    newTag: latest
  - name: donekaro/notification-service
    newName: your-acr.azurecr.io/donekaro/notification-service
    newTag: latest
  - name: donekaro/recurring-engine
    newName: your-acr.azurecr.io/donekaro/recurring-engine
    newTag: latest
  - name: donekaro/frontend
    newName: your-acr.azurecr.io/donekaro/frontend
    newTag: latest
