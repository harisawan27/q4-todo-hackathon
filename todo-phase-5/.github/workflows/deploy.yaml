name: DoneKaro CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint-test:
    name: Lint & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chat-api, notification-service, recurring-engine]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check app/

      - name: Format check with ruff
        run: ruff format --check app/

      - name: Run tests
        run: pytest tests/ -v --tb=short || echo "No tests found"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint || echo "No lint script"

      - name: Build
        run: npm run build

  build-images:
    name: Build Docker Images
    needs: [lint-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build chat-api image
        uses: docker/build-push-action@v5
        with:
          context: services/chat-api
          push: false
          tags: donekaro/chat-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build notification-service image
        uses: docker/build-push-action@v5
        with:
          context: services/notification-service
          push: false
          tags: donekaro/notification-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build recurring-engine image
        uses: docker/build-push-action@v5
        with:
          context: services/recurring-engine
          push: false
          tags: donekaro/recurring-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          tags: donekaro/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Tests
    needs: [build-images]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Start services with docker-compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Health checks
        run: |
          curl -sf http://localhost:8000/health || exit 1
          echo "chat-api healthy"
          curl -sf http://localhost:8001/health || exit 1
          echo "notification-service healthy"
          curl -sf http://localhost:8002/health || exit 1
          echo "recurring-engine healthy"

      - name: Cleanup
        if: always()
        run: docker compose down -v

  deploy-production:
    name: Deploy to Production
    needs: [integration-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install donekaro helm/donekaro \
            -f helm/donekaro/values-production.yaml \
            --namespace donekaro \
            --create-namespace \
            --wait --timeout 600s

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/chat-api -n donekaro --timeout=300s
          kubectl rollout status deployment/notification-service -n donekaro --timeout=300s
          kubectl rollout status deployment/recurring-engine -n donekaro --timeout=300s
