apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  labels:
    app: chat-api
    {{- include "donekaro.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.chatApi.replicaCount }}
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
      annotations:
        {{- include "donekaro.daprAnnotations" .Values.chatApi.dapr | nindent 8 }}
    spec:
      containers:
        - name: chat-api
          image: "{{ .Values.chatApi.image.repository }}:{{ .Values.chatApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.chatApi.dapr.appPort }}
          env:
            - name: SERVICE_NAME
              value: "chat-api"
            - name: LOG_LEVEL
              value: {{ .Values.chatApi.env.LOG_LEVEL | quote }}
            - name: DAPR_HTTP_PORT
              value: {{ .Values.chatApi.dapr.httpPort | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.chatApi.dapr.appPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.chatApi.dapr.appPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.chatApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  labels:
    app: chat-api
    {{- include "donekaro.labels" . | nindent 4 }}
spec:
  selector:
    app: chat-api
  ports:
    - port: {{ .Values.chatApi.service.port }}
      targetPort: {{ .Values.chatApi.service.targetPort }}
      protocol: TCP
  type: ClusterIP
{{- if .Values.chatApi.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-api-hpa
  labels:
    app: chat-api
    {{- include "donekaro.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-api
  minReplicas: {{ .Values.chatApi.hpa.minReplicas }}
  maxReplicas: {{ .Values.chatApi.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.chatApi.hpa.targetCPU }}
{{- end }}
