apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
    {{- include "donekaro.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.notificationService.replicaCount }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        {{- include "donekaro.daprAnnotations" .Values.notificationService.dapr | nindent 8 }}
    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.notificationService.image.repository }}:{{ .Values.notificationService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.notificationService.dapr.appPort }}
          env:
            - name: SERVICE_NAME
              value: "notification-service"
            - name: LOG_LEVEL
              value: {{ .Values.notificationService.env.LOG_LEVEL | quote }}
            - name: DAPR_HTTP_PORT
              value: {{ .Values.notificationService.dapr.httpPort | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.notificationService.dapr.appPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.notificationService.dapr.appPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
    {{- include "donekaro.labels" . | nindent 4 }}
spec:
  selector:
    app: notification-service
  ports:
    - port: {{ .Values.notificationService.service.port }}
      targetPort: {{ .Values.notificationService.service.targetPort }}
      protocol: TCP
  type: ClusterIP
