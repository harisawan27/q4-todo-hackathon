version: 1
common:
  resourcesPath: ./dapr-components/local/
apps:
  - appID: chat-api
    appDirPath: ./services/chat-api/
    appPort: 8000
    daprHTTPPort: 3500
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env:
      SERVICE_NAME: chat-api
      LOG_LEVEL: DEBUG
      DAPR_HTTP_PORT: "3500"
  - appID: notification-service
    appDirPath: ./services/notification-service/
    appPort: 8001
    daprHTTPPort: 3501
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    env:
      SERVICE_NAME: notification-service
      LOG_LEVEL: DEBUG
      DAPR_HTTP_PORT: "3501"
  - appID: recurring-engine
    appDirPath: ./services/recurring-engine/
    appPort: 8002
    daprHTTPPort: 3502
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    env:
      SERVICE_NAME: recurring-engine
      LOG_LEVEL: DEBUG
      DAPR_HTTP_PORT: "3502"
