# Dapr Declarative Subscriptions for DoneKaro Event-Driven System
# These CRDs are applied to Kubernetes alongside Dapr components.
# Each subscription scopes a topic to a specific service and routes
# events to the service's handler endpoints.

---
# ============================================================================
# recurring-engine subscriptions
# ============================================================================

# Subscribes recurring-engine to task-events topic
# Routes task-completed events (for recurrence generation)
# and task-created/updated events (for reminder scheduling)
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: recurring-engine-task-events
  namespace: donekaro
spec:
  pubsubname: pubsub-kafka
  topic: task-events
  routes:
    rules:
      - match: event.type == "com.donekaro.task.completed"
        path: /events/task-completed
      - match: event.type == "com.donekaro.task.created"
        path: /events/task-created
      - match: event.type == "com.donekaro.task.updated"
        path: /events/task-updated
      - match: event.type == "com.donekaro.task.deleted"
        path: /events/task-deleted
    default: /events/task-events
  deadLetterTopic: dead-letter-task-events
  scopes:
    - recurring-engine

---
# ============================================================================
# notification-service subscriptions
# ============================================================================

# Subscribes notification-service to reminders topic
# Handles reminder-fired events for push notification delivery
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: notification-reminders
  namespace: donekaro
spec:
  pubsubname: pubsub-kafka
  topic: reminders
  routes:
    rules:
      - match: event.type == "com.donekaro.reminder.fired"
        path: /events/reminder-fired
      - match: event.type == "com.donekaro.reminder.recurring-trigger"
        path: /events/recurring-trigger
    default: /events/reminders
  deadLetterTopic: dead-letter-reminders
  scopes:
    - notification-service

---
# Subscribes notification-service to task-updates topic
# Handles cross-client real-time update propagation
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: notification-task-updates
  namespace: donekaro
spec:
  pubsubname: pubsub-kafka
  topic: task-updates
  routes:
    default: /events/task-updates
  deadLetterTopic: dead-letter-task-updates
  scopes:
    - notification-service

---
# ============================================================================
# chat-api subscriptions (for SSE bridge)
# ============================================================================

# Subscribes chat-api to task-updates topic
# Bridges events to SSE connections for real-time frontend updates
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: chat-api-task-updates
  namespace: donekaro
spec:
  pubsubname: pubsub-kafka
  topic: task-updates
  routes:
    default: /events/task-updates
  scopes:
    - chat-api

---
# ============================================================================
# Dead Letter Topic Subscriptions (monitoring/debugging)
# ============================================================================

# Note: Dead letter topics accumulate failed messages.
# In production, set up monitoring/alerting on dead letter topic lag.
# Dead letter topic retention: 30 days (configured in Kafka topic settings).
#
# Dead letter topics created automatically by Dapr:
# - dead-letter-task-events     (failed task event processing)
# - dead-letter-reminders       (failed reminder delivery)
# - dead-letter-task-updates    (failed update propagation)
