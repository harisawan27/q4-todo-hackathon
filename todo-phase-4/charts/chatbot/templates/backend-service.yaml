apiVersion: v1
kind: Service
metadata:
  name: {{ include "chatbot.fullname" . }}-backend
  labels:
    {{- include "chatbot.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8001
      protocol: TCP
      name: http
      {{- if eq .Values.backend.service.type "NodePort" }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "chatbot.backend.selectorLabels" . | nindent 4 }}
