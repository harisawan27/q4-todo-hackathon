{{/*
NOTE: This template is provided for reference only.
Secrets should be created MANUALLY before deploying the chart.

Create secrets with:
  kubectl create secret generic chatbot-secrets \
    --from-literal=GEMINI_API_KEY='your-api-key' \
    --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db'

Or from an env file:
  kubectl create secret generic chatbot-secrets --from-env-file=secrets.env

DO NOT commit actual secret values to version control.
*/}}

{{/*
Uncomment the following if you want to manage secrets via Helm values
(NOT RECOMMENDED for production - use external secret management)

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secretName }}
  labels:
    {{- include "chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | b64enc | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
*/}}
