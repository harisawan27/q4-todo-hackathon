apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chatbot.fullname" . }}-config
  labels:
    {{- include "chatbot.labels" . | nindent 4 }}
data:
  # Backend API URL for frontend (Kubernetes internal DNS)
  backend-url: {{ .Values.config.backendUrl | quote }}
  # LLM model configuration
  llm-model: {{ .Values.config.llmModel | quote }}
