# Default values for chatbot Helm chart
# This is a YAML-formatted file.

# =============================================================================
# Global settings
# =============================================================================
nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Backend Configuration
# =============================================================================
backend:
  replicaCount: 1

  image:
    repository: chatbot-backend
    tag: local
    pullPolicy: Never  # Use local images built in Minikube

  service:
    type: NodePort
    port: 8001
    nodePort: 30081  # External access port for backend API

  # Resource requests and limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Health probes
  livenessProbe:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Environment variables from ConfigMap
  env:
    LLM_MODEL: "gemini/gemini-2.5-flash"

  # Secret reference name (must be created separately)
  secretName: "chatbot-secrets"

# =============================================================================
# Frontend Configuration
# =============================================================================
frontend:
  replicaCount: 1

  image:
    repository: chatbot-frontend
    tag: local
    pullPolicy: Never  # Use local images built in Minikube

  service:
    type: NodePort
    port: 3000
    nodePort: 30080  # External access port

  # Resource requests and limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Health probes
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# ConfigMap Values
# =============================================================================
config:
  # Backend API URL for frontend
  # IMPORTANT: This must be accessible from the BROWSER (not inside the cluster)
  # For Minikube: use $(minikube ip):30081, e.g., "http://192.168.49.2:30081"
  # For Docker Desktop: use "http://localhost:30081"
  backendUrl: "http://192.168.49.2:30081"
  # LLM model to use
  llmModel: "gemini/gemini-2.5-flash"

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: false
  name: ""

# =============================================================================
# Pod settings
# =============================================================================
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
