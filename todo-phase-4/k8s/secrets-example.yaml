# =============================================================================
# Kubernetes Secrets Example Template
# =============================================================================
#
# DO NOT COMMIT THIS FILE WITH ACTUAL VALUES!
#
# This file shows the structure of secrets required for the chatbot application.
# Create the actual secrets using kubectl commands below.
#
# =============================================================================

# Option 1: Create from literal values (RECOMMENDED)
# ---------------------------------------------------------
# kubectl create secret generic chatbot-secrets \
#   --from-literal=GEMINI_API_KEY='your-actual-api-key' \
#   --from-literal=DATABASE_URL='postgresql://user:password@host:5432/database'

# Option 2: Create from env file
# ---------------------------------------------------------
# Create a file called 'secrets.env' (add to .gitignore!) with:
#   GEMINI_API_KEY=your-actual-api-key
#   DATABASE_URL=postgresql://user:password@host:5432/database
#
# Then run:
#   kubectl create secret generic chatbot-secrets --from-env-file=secrets.env

# Option 3: Create from YAML (for reference only - use base64 encoded values)
# ---------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secrets
  labels:
    app.kubernetes.io/name: chatbot
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Base64 encoded values - REPLACE WITH YOUR ACTUAL BASE64 ENCODED SECRETS
  # To encode: echo -n 'your-value' | base64
  GEMINI_API_KEY: eW91ci1hY3R1YWwtYXBpLWtleQ==  # Placeholder: 'your-actual-api-key'
  DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc3dvcmRAaG9zdDo1NDMyL2RhdGFiYXNl  # Placeholder

# =============================================================================
# Verification Commands
# =============================================================================
#
# Verify secret was created:
#   kubectl get secrets chatbot-secrets
#
# View secret metadata:
#   kubectl describe secret chatbot-secrets
#
# Decode a secret value (for debugging):
#   kubectl get secret chatbot-secrets -o jsonpath='{.data.GEMINI_API_KEY}' | base64 -d
#
# Delete and recreate secret:
#   kubectl delete secret chatbot-secrets
#   kubectl create secret generic chatbot-secrets --from-literal=...
#
# =============================================================================
